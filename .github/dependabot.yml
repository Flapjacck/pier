# Keeps dependencies current with weekly PRs:
# - github-actions: the SHA-pinned actions in .github/workflows/
# - npm: backend/ and frontend/, each with its own pnpm-lock.yaml
# - docker: the digest-pinned node base image in backend/Dockerfile
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directories: ["/backend", "/frontend"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope # chore(deps): ... / chore(deps-dev): ...
    groups:
      # Minor and patch bumps land together; majors get their own PR.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore
      include: scope
