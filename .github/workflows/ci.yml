name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions are pinned to full commit SHAs (version in the comment).
# Dependabot (.github/dependabot.yml) opens PRs to bump them.

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: backend/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: backend

      - run: pnpm audit --prod --audit-level high
        working-directory: backend

      - name: Check deploy scripts
        run: |
          bash -n backend/scripts/deploy-local.sh backend/scripts/lib/*.sh
          shellcheck -x backend/scripts/*.sh backend/scripts/lib/*.sh

      - run: pnpm lint
        working-directory: backend

      - run: pnpm typecheck
        working-directory: backend

      - run: pnpm test
        working-directory: backend

      - run: pnpm build
        working-directory: backend

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: frontend

      - run: pnpm audit --prod --audit-level high
        working-directory: frontend

      - run: pnpm lint
        working-directory: frontend

      - run: pnpm typecheck
        working-directory: frontend

      - run: pnpm test
        working-directory: frontend

      - run: pnpm build
        working-directory: frontend

  image:
    name: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same build deploy-local.sh runs (repo-root context). Build only, never pushed.
      - name: Build pier-backend image
        run: docker build -f backend/Dockerfile -t pier-backend:ci .
