# Build Jobs and git credential Secrets live in pier-system (#83).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pier-backend-builds
  namespace: pier-system
  labels:
    app.kubernetes.io/managed-by: pier
    app.kubernetes.io/part-of: pier
rules:
  - apiGroups: ["batch"]
    resources: ["jobs", "jobs/status"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pier-backend-builds
  namespace: pier-system
  labels:
    app.kubernetes.io/managed-by: pier
    app.kubernetes.io/part-of: pier
subjects:
  - kind: ServiceAccount
    name: pier-backend
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pier-backend-builds
