apiVersion: apps/v1
kind: Deployment
metadata:
  name: pi-backend
  namespace: default
  labels:
    app: pi-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pi-backend
  template:
    metadata:
      labels:
        app: pi-backend
    spec:
      serviceAccountName: pi-backend
      containers:
        - name: api
          image: pi-backend:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: HOST
              value: "0.0.0.0"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: pi-backend
  namespace: default
spec:
  selector:
    app: pi-backend
  ports:
    - port: 80
      targetPort: http
