# Read-only cluster access for /cluster/health and /cluster/pods.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pier-backend
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pier-backend-cluster-health
rules:
  # TODO(#5): Remove "pods" from here — only cluster-wide node health should be readable.
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
  - nonResourceURLs: ["/version", "/healthz", "/livez", "/readyz"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pier-backend-cluster-health
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pier-backend-cluster-health
subjects:
  - kind: ServiceAccount
    name: pier-backend
    namespace: default
