# Namespaced RBAC for pier-apps: Role and RoleBinding for app management.
# This is a namespace-scoped Role (not ClusterRole) for least-privilege access.
# Only pier-backend (in namespace default) can manage apps in pier-apps.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pier-app-manager
  namespace: pier-apps
  labels:
    app.kubernetes.io/managed-by: pier
    app.kubernetes.io/part-of: pier
rules:
  # Least privilege: only the verbs the backend actually calls (see src/k8s/).
  # Re-check with: grep -rnoE "(read|list|create|patch|replace|delete)Namespaced\w+|k8s\.(Watch|Log)" src
  # There is no watch or informer anywhere, and nothing replaces (PUTs) a
  # Deployment, Service or Ingress, so `watch` and `update` are not granted.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    # get: app-lookup, create-app (exists check) | list: apps (GET /apps)
    # create: create-app | patch: app-actions restart | delete: app-actions, create-app rollback
    verbs: ["get", "list", "create", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    # update: app-actions scale (replaceNamespacedDeploymentScale is a PUT; never read or patched)
    verbs: ["update"]
  - apiGroups: [""]
    resources: ["services"]
    # get: app-actions delete (exists check) | create: create-app | delete: app-actions, create-app rollback
    verbs: ["get", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    # list: app-pods, list-pods (cluster route). No single-pod reads.
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    # get: logs and logs-stream routes via k8s.Log (follow is still a get)
    verbs: ["get"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    # get: app-lookup, app-actions delete | list: apps, create-app (host conflict check)
    # create: create-app | delete: app-actions, create-app rollback
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pier-app-manager
  namespace: pier-apps
  labels:
    app.kubernetes.io/managed-by: pier
    app.kubernetes.io/part-of: pier
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pier-app-manager
subjects:
  - kind: ServiceAccount
    name: pier-backend
    namespace: default
