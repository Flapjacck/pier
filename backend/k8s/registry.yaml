# In-cluster OCI registry for images Pier builds (#83).
# NodePort 30500 so kubelet/containerd on the k3s node can pull the same
# localhost:30500/<app>:<tag> ref Kaniko pushes (see configure-k3s-registry.sh).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pier-registry-data
  namespace: pier-system
  labels:
    app.kubernetes.io/managed-by: pier
    app.kubernetes.io/part-of: pier
    app: pier-registry
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: pier-local
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pier-registry
  namespace: pier-system
  labels:
    app: pier-registry
    app.kubernetes.io/managed-by: pier
    app.kubernetes.io/part-of: pier
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pier-registry
  template:
    metadata:
      labels:
        app: pier-registry
    spec:
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: registry
          # registry:2.8.3 — pin; bump deliberately.
          image: registry:2.8.3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pier-registry-data
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: pier-system
  labels:
    app: pier-registry
    app.kubernetes.io/managed-by: pier
    app.kubernetes.io/part-of: pier
spec:
  type: NodePort
  selector:
    app: pier-registry
  ports:
    - name: http
      port: 5000
      targetPort: http
      nodePort: 30500
