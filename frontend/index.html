<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pier</title>

    <!-- No-flash theme script: runs before styles load to set data-theme + theme-color meta -->
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('pier-theme');
          const theme = (stored === 'light' || stored === 'dark') ? stored : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
          const meta = document.querySelector('meta[name="theme-color"]') || document.createElement('meta');
          meta.setAttribute('name', 'theme-color');
          meta.setAttribute('content', theme === 'light' ? '#ffffff' : '#000000');
          if (!document.querySelector('meta[name="theme-color"]')) document.head.appendChild(meta);
        } catch {}
      })();
    </script>

    <!-- Favicons + PWA (from pier-brand-kit/favicon/) -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#ffffff" />

    <!-- Social preview -->
    <meta property="og:title" content="Pier" />
    <meta property="og:description" content="Apps dock here." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
